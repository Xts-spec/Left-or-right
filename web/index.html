<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>左右</title>
    <script>
      if (window.cockpit) document.documentElement.classList.add("liuwa-host");
    </script>
    <link rel="icon" href="modules/pangsi-mark.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="vendor/katex/katex.min.css" />
    <link rel="stylesheet" href="vendor/highlight/github-dark.min.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="modules/protected-controls.css" />
    <!-- KaTeX + highlight.js 与 Gank 用同一套；本地 vendor，不依赖网络。 -->
    <script defer src="vendor/katex/katex.min.js"></script>
    <script defer src="vendor/highlight/highlight.min.js"></script>
  </head>
  <body class="liuwa-page is-empty">
    <main class="liuwa-orb">
      <div class="liuwa-shots" id="liuwaShots" aria-label="题目截图" hidden></div>
      <nav class="liuwa-command-bar" aria-label="截图与解题">
        <button type="button" id="liuwaCapture">截图 <kbd id="hintCapture" data-key-action="captureRegion">⌘H</kbd></button>
        <button type="button" id="liuwaSend">解题 <kbd data-key-action="sendChat">⌘Enter</kbd></button>
        <button type="button" id="liuwaDelete">删图 <kbd data-key-action="deleteLastShot">⌘L</kbd></button>
        <button type="button" id="liuwaReset">重置 <kbd data-key-action="resetView">⌘R</kbd></button>
        <button type="button" id="liuwaToggleShots" aria-expanded="true" aria-controls="liuwaShots" hidden>题图</button>
        <details class="liuwa-display" id="liuwaDisplay">
          <summary aria-label="快捷设置" title="快捷设置">⚙</summary>
          <div class="liuwa-display-panel">
            <header class="liuwa-settings-title"><strong>快捷设置</strong><button type="button" id="liuwaCloseSettings" aria-label="关闭快捷设置">×</button></header>
            <label for="quickSpecialty">专业 / 方向</label>
            <div class="liuwa-study-choice"><select id="quickSpecialty" disabled><option value="">正在读取…</option></select><input id="quickSpecialtyCustom" aria-label="自定义专业方向" maxlength="120" placeholder="输入专业或考试方向" hidden disabled /></div>
            <label for="quickProgrammingLanguage">编程语言</label>
            <div class="liuwa-study-choice"><select id="quickProgrammingLanguage" disabled><option value="">正在读取…</option></select><input id="quickProgrammingLanguageCustom" aria-label="自定义编程语言" maxlength="80" placeholder="输入编程语言" hidden disabled /></div>
            <label for="quickAnswerLanguage">回答语言</label>
            <select id="quickAnswerLanguage" disabled><option value="zh-CN">中文</option><option value="en-US">English</option></select>
            <div class="liuwa-theme-options" role="group" aria-label="外观模式">
              <button type="button" data-theme-mode="light" aria-label="白色模式">白色</button>
              <button type="button" data-theme-mode="dark" aria-label="黑色模式">黑色</button>
              <button type="button" data-theme-mode="transparent-black" aria-label="透明黑字模式">透明黑字</button>
              <button type="button" data-theme-mode="transparent-white" aria-label="透明白字模式">透明白字</button>
            </div>
            <label for="quickIdentity">我的身份</label><select id="quickIdentity" disabled><option value="candidate">面试者</option><option value="interviewer">面试官</option></select>
            <label for="quickCaptureMode">截图方式</label><select id="quickCaptureMode" disabled><option value="area">局部截图</option><option value="full">全屏截图</option></select>
            <label for="quickDisplay">运行显示器</label><select id="quickDisplay" disabled><option value="">正在读取…</option></select>
            <label for="liuwaOpacity">背景不透明度 <output id="liuwaOpacityValue">90%</output></label>
            <input type="range" id="liuwaOpacity" min="0" max="100" step="1" value="90" />
            <label for="liuwaLayout">回答窗口</label><select id="liuwaLayout"><option value="narrow">窄长</option><option value="standard">标准</option><option value="wide">宽屏</option></select>
            <button type="button" id="liuwaCompact">收起回答</button>
            <p id="liuwaDisplayStatus" role="status"></p>
            <label for="quickModel">当前模型</label><select id="quickModel" disabled><option value="">正在读取…</option></select>
            <div class="liuwa-settings-actions"><button type="button" id="quickRefreshModels">刷新</button></div>
        <section class="liuwa-shortcuts" id="liuwaKeys">
          <div class="liuwa-shortcut-primary" hidden>
            <span>截图 <kbd data-key-action="captureRegion">⌘H</kbd></span>
            <span>处理 <kbd id="hintSend" data-key-action="sendChat">⌘Enter</kbd></span>
            <span>显示/隐藏 <kbd data-key-action="toggleWindow">⌘B</kbd></span>
            <span>删除最后一张 <kbd data-key-action="deleteLastShot">⌘L</kbd></span>
          </div>
          <details>
            <summary aria-label="全部快捷键">全部快捷键</summary>
            <div class="liuwa-shortcut-grid">
              <span>上一页 <kbd data-key-action="readPrev">⌘,</kbd></span>
              <span>下一页 <kbd data-key-action="readNext">⌘.</kbd></span>
              <span>内容上滚 <kbd data-key-action="scrollUp">⌘;</kbd></span>
              <span>内容下滚 <kbd data-key-action="scrollDown">⌘'</kbd></span>
              <span>窗口上移 <kbd data-key-action="moveUp">⌘↑</kbd></span>
              <span>窗口下移 <kbd data-key-action="moveDown">⌘↓</kbd></span>
              <span>窗口左移 <kbd data-key-action="moveLeft">⌘←</kbd></span>
              <span>窗口右移 <kbd data-key-action="moveRight">⌘→</kbd></span>
              <span>降低不透明度 <kbd data-key-action="opacityDown">⌘[</kbd></span>
              <span>提高不透明度 <kbd data-key-action="opacityUp">⌘]</kbd></span>
              <span>缩小字号 <kbd data-key-action="zoomOut">⌘−</kbd></span>
              <span>还原字号 <kbd data-key-action="zoomReset">⌘0</kbd></span>
              <span>放大字号 <kbd data-key-action="zoomIn">⌘=</kbd></span>
              <span>重置视图 <kbd data-key-action="resetView">⌘R</kbd></span>
              <span>新对话 <kbd data-key-action="newQuestion">⌘N</kbd></span>
              <span>清空截图 <kbd data-key-action="clearShots">⌘⇧⌫</kbd></span>
              <span>操作面板 <kbd id="hintInteract" data-key-action="toggleVisible">⌘⇧Space</kbd></span>
              <span>全屏截图 <kbd data-key-action="captureScreen">⌘⇧Y</kbd></span>
              <span>紧凑 / 展开 <kbd data-key-action="toggleCompact">⌘⇧J</kbd></span>
              <span>退出 <kbd data-key-action="quitApp">⌘Q</kbd></span>
            </div>
          </details>
          <p class="liuwa-hotkey-warning" id="liuwaHotkeyWarning" role="status" hidden></p>
        </section>

            <button type="button" id="quickAdvancedSettings">更多设置 ↗</button>
            <button type="button" id="quickManageAssets">学习资产 ↗</button>
            <p id="quickSettingsStatus" role="status">正在读取设置…</p>
          </div>
        </details>
      </nav>
      <section class="liuwa-reader" aria-label="题解阅读区">
        <nav class="liuwa-pagination" id="liuwaPagination" aria-label="题解翻页" hidden>
          <button type="button" id="liuwaReadingPrev" disabled>上一页</button>
          <span>使用 <kbd data-key-action="readPrev">⌘,</kbd> / <kbd data-key-action="readNext">⌘.</kbd> 左右切换</span>
          <button type="button" id="liuwaReadingNext" disabled>下一页</button>
          <select id="liuwaQuestions" aria-label="切换本题会话里的历史题目" hidden></select>
          <select id="liuwaSections" aria-label="定位回答章节" hidden></select>
        </nav>
        <div id="liuwaAnswerTabs" class="liuwa-answer-tabs" role="tablist" aria-label="回答内容" hidden></div>
      <div class="liuwa-thread" id="liuwaThread" role="region" aria-label="题目与 AI 讲解" aria-live="polite" aria-relevant="additions text">
        <div class="liuwa-idle" id="liuwaIdle">
          <h2>思路，就在旁边。</h2>
          <p>截下这道题，慢慢看懂它。</p>
        </div>
      </div>
      </section>

      <div class="liuwa-feedback"><p class="liuwa-status" id="liuwaStatus" role="status"></p><button type="button" class="liuwa-stop" id="liuwaStop" aria-label="停止生成" hidden>停止生成</button></div>
    </main>
    <input type="file" id="liuwaImageImport" accept="image/*" multiple hidden />
    <script type="module" src="modules/home.js"></script>
  </body>
</html>
